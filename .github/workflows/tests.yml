name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact versions
        run: python -m pip install -r requirements.lock
      - name: Run tests
        run: python -m pytest tests -q
